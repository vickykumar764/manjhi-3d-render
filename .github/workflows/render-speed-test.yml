# Manjhi 3D short — 10-frame speed test on GitHub Actions
# PURPOSE: measure the REAL per-frame speed on an Actions runner BEFORE committing to
# the full 1,254-frame render, AND verify the frames are NOT tiled (the reason this
# uses STILLS, not `remotion render` — see render.yml header for the tiling defect).
# The local VM renders ~160-200 s/frame through the PostDriver
# (f200 197.7 s, f350 161.5 s, scale 0.5 stills) — the Actions number is unknown and decides
# the shard count for the full run. Run this FIRST (Actions tab -> Run workflow).
# EXPECTED: the 10-frame clip `speed-test-10` + a log line "SECONDS_PER_FRAME=<x>".
# Then CHECK EVERY FRAME of the clip visually for tiling (mountain/sky repeating
# vertically, seam at ~88% width) — do NOT run the full render on a tiled speed test.
# If the clip is blank/black, the browser path is wrong (see the --browser-executable note below).
name: Manjhi speed test (10 frames)

on:
  workflow_dispatch:

jobs:
  speed-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        # Full Playwright Chromium is the PROVEN WebGL path (the Remotion headless shell could
        # not create a WebGL context on our VM; full Chrome with --gl swangle works). Install
        # both; the render uses the Playwright Chrome explicitly.
        run: |
          npx playwright install --with-deps chromium
          npx remotion browser ensure

      - name: "Install ffmpeg (ffprobe is used after the render; NOT preinstalled on ubuntu-latest — without this the run fails \"ffprobe: command not found\", exit 127, even though the render itself succeeded)"
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Render frames 0-9 (stills + ffmpeg)
        env:
          REMOTION_TMP: ${{ runner.temp }}/remotion-tmp
        run: |
          CHROME=$(find ~/.cache/ms-playwright -name chrome -type f | head -1)
          echo "Chrome: $CHROME"
          mkdir -p out
          MANJHI_CHROME="$CHROME" node scripts/manjhi-render-shard.mjs --frames 0-9 --out out/speed-test-10.mp4

      - name: Blank check (frames must vary, not one flat colour)
        # A blank render has YDIF ~ 0 (no change between frames). Prints YAVG/YDIF per frame;
        # YDIF must be clearly > 0. The clip itself is also uploaded for a visual check.
        run: |
          ffmpeg -i out/speed-test-10.mp4 -vf signalstats -f null - 2>&1 | grep -o "YAVG:[0-9.]* YDIF:[0-9.]*" | head -5

      - name: Upload 10-frame clip
        uses: actions/upload-artifact@v4
        with:
          name: speed-test-10
          path: out/speed-test-10.mp4
          retention-days: 1
