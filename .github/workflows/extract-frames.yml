name: Extract speed-test frames
on:
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download clip and extract frames
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42779656062 -n speed-test-10 -D /tmp/clip
          ls -la /tmp/clip
          mkdir -p frames-check
          cp /tmp/clip/speed-test-10.mp4 frames-check/speed-test-10.mp4
          ffmpeg -y -i /tmp/clip/speed-test-10.mp4 -vf fps=30 -start_number 0 frames-check/frame-%02d.png
          ls -la frames-check
          rm -f .github/workflows/extract-frames.yml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Add speed-test-10 frames for tiling check" || echo "nothing to commit"
          git push
